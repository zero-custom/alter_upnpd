services:
  gost:
    image: gogost/gost:latest
    network_mode: host
    restart: unless-stopped
    command: ["-api", ":8000"]

  alter_upnpd:
    image: zerocustom/alter_upnpd:latest
    restart: unless-stopped
    depends_on:
      - gost
    ports:
      - 5000:5000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/app/docker.sh"]
    command: ["gunicorn", "-c", "gunicorn_config.py", "app:application"]
    healthcheck:
      test: wget -qO - http://localhost:5000/health | grep -q healthy
      interval: 5s
      start_period: 30s
      timeout: 5s
      retries: 3
    environment:
      - TZ=UTC
      - GOST_API_URL=http://host.docker.internal:8000
      - LISTEN_PORT=5000
      - ACL_ENABLED=true
      - ACL_ALLOWED_SUBNETS=172.16.0.0/12
      - SSDP_NOTIFY_INTERVAL=180
      - LEASE_DURATION=604800
      - LEASE_CLEANUP_INTERVAL=60
      - STUN_SERVER=stun.l.google.com:19302